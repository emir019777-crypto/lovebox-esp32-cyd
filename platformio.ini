[env:esp32-2432s028r]
platform = espressif32
board = esp32-2432s028r
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    lovyan03/LovyanGFX @ ^1.1.0
    m5stack/M5GFX @ ^0.0.13
    bblanchon/ArduinoJson @ ^6.21.2
    WiFi

build_flags =
    -DUSER_SETUP_LOADED=1
    -DLV_CONF_INCLUDE_SIMPLE=1
